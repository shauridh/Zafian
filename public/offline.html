<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Zafian POS</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf7f0;
      font-family: system-ui, sans-serif;
      color: #141414;
    }
    .card {
      border: 3px solid #141414;
      border-radius: 16px;
      box-shadow: 6px 6px 0 #141414;
      background: #ffd93d;
      padding: 32px;
      text-align: center;
      max-width: 320px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📡 Tidak ada koneksi</h1>
    <p>Koneksi internet terputus. Coba lagi setelah koneksi kembali stabil.</p>
  </div>
</body>
</html>
